<svg viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#3B5BDB"/><stop offset="1" stop-color="#70A5FD"/>
    </linearGradient>
    <path id="p" d="M70 95 H830"/>
  </defs>
  <rect width="900" height="190" rx="14" fill="#0D1117"/>
  <path d="M70 95 H830" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <g text-anchor="middle" font-size="13" fill="#e6edf3">
    <g><rect x="20" y="65" width="100" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
       <text x="70" y="91">raw</text><text x="70" y="108" fill="#8b949e" font-size="11">gmail · nse</text></g>
    <g><rect x="170" y="65" width="100" height="60" rx="10" fill="#161b22" stroke="#b8793a"/>
       <text x="220" y="91">bronze</text><text x="220" y="108" fill="#8b949e" font-size="11">ingest</text></g>
    <g><rect x="320" y="65" width="100" height="60" rx="10" fill="#161b22" stroke="#9aa5b1"/>
       <text x="370" y="91">silver</text><text x="370" y="108" fill="#8b949e" font-size="11">clean · model</text></g>
    <g><rect x="470" y="65" width="100" height="60" rx="10" fill="#161b22" stroke="#e3b341"/>
       <text x="520" y="91">gold</text><text x="520" y="108" fill="#8b949e" font-size="11">features</text></g>
    <g><rect x="620" y="55" width="110" height="80" rx="10" fill="#161b22" stroke="url(#g)" stroke-width="2"/>
       <text x="675" y="86" fill="#70A5FD">deterministic</text>
       <text x="675" y="104" fill="#70A5FD">engine</text>
       <text x="675" y="122" fill="#8b949e" font-size="11">no LLM</text></g>
    <g><rect x="780" y="65" width="100" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
       <text x="830" y="91">LLM</text><text x="830" y="108" fill="#8b949e" font-size="11">narrates only</text></g>
  </g>

  <circle r="5" fill="#70A5FD">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p"/></animateMotion>
  </circle>
  <circle r="5" fill="#70A5FD" opacity=".6">
    <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite"><mpath href="#p"/></animateMotion>
  </circle>
  <circle r="5" fill="#70A5FD" opacity=".35">
    <animateMotion dur="5s" begin="3.4s" repeatCount="indefinite"><mpath href="#p"/></animateMotion>
  </circle>

  <text x="450" y="34" text-anchor="middle" font-size="14" fill="#8b949e">data produces the truth → code decides → the model explains</text>
  <text x="450" y="168" text-anchor="middle" font-size="12" fill="#6e7681">verdict is injected after inference, so the LLM never writes a number</text>
</svg>
